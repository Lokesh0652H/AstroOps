services:
  - type: web
    name: astraops-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DB_NAME
        value: astraops
      - key: CORS_ORIGINS
        value: https://frontend-7srajykxj-lokeshkhodke456-2902s-projects.vercel.app
      - key: MONGO_URL
        sync: false
